name: Semantic PR Title

# pull_request_target (not pull_request): fork PRs run with a read-only
# token under pull_request, which crashes the title check with
# "Resource not accessible by integration" on every contributor PR.
# pull_request_target runs the base-branch workflow with write access.
# This is safe: nothing checks out or executes PR code, the pinned action
# only reads the PR title string.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write

jobs:
  lint-title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: Subject must start with lowercase and not end with a period.
          wip: true
          validateSingleCommit: false
