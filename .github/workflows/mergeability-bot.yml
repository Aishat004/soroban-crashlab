name: PR Mergeability Bot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  check_run:
    types: [completed]
  workflow_dispatch:

concurrency:
  group: mergeability-${{ github.event.pull_request.number || github.event.check_run.head_sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  checks: read
  statuses: read

jobs:
  mergeability:
    name: Check PR Mergeability
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Evaluate mergeability and comment
        uses: actions/github-script@v7
        with:
          # Comment as the repo owner instead of github-actions[bot].
          # Requires a fine-grained PAT owned by trinnode with Pull requests
          # (Read & Write) and Checks (Read) scopes on this repository, stored
          # as the TRINNODE_BOT_TOKEN secret. Falls back to GITHUB_TOKEN.
          github-token: ${{ secrets.TRINNODE_BOT_TOKEN || github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const marker = '<!-- crashlab-mergeability -->';
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            let candidates = [];
            if (context.eventName === 'pull_request') {
              candidates.push(context.payload.pull_request.number);
            } else {
              const sha = context.payload.check_run && context.payload.check_run.head_sha;
              if (!sha) {
                console.log('No head SHA available, skipping');
                return;
              }
              const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: sha,
              });
              for (const pr of pulls) {
                if (pr.state === 'open') candidates.push(pr.number);
              }
            }

            const numbers = [...new Set(candidates)];
            if (numbers.length === 0) {
              console.log('No open pull requests to evaluate');
              return;
            }

            for (const number of numbers) {
              await evaluate(number);
            }

            async function evaluate(number) {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              if (pr.state !== 'open') return;

              const branch = pr.head.ref;
              const base = pr.base.ref;
              console.log(`Evaluating PR #${number} (${branch} -> ${base})`);

              let mergeable = pr.mergeable;
              let tries = 0;
              while (mergeable === null && tries < 6) {
                await sleep(3000);
                const fresh = await github.rest.pulls.get({ owner, repo, pull_number: number });
                mergeable = fresh.data.mergeable;
                tries++;
              }

              if (mergeable === null) {
                console.log(`PR #${number}: mergeability still computing, skipping`);
                return;
              }

              const issues = [];

              if (mergeable === false) {
                issues.push({
                  title: 'Merge conflicts',
                  detail: `This branch conflicts with \`${base}\`. It cannot be merged until the conflicts are resolved.`,
                  fix: [
                    `git checkout ${branch}`,
                    `git fetch origin`,
                    `git merge origin/${base}`,
                    'Resolve the conflicts, then commit',
                    'git push',
                  ],
                });
              }

              const failing = [];

              try {
                const { data: suite } = await github.rest.checks.listForRef({
                  owner,
                  repo,
                  ref: pr.head.sha,
                  status: 'completed',
                });
                for (const check of suite.check_runs) {
                  if (['failure', 'timed_out', 'cancelled'].includes(check.conclusion)) {
                    failing.push({ name: check.name, url: check.html_url });
                  }
                }
              } catch (error) {
                console.log(`PR #${number}: unable to list check runs: ${error.message}`);
              }

              try {
                const { data: combined } = await github.rest.repos.getCombinedStatusForRef({
                  owner,
                  repo,
                  ref: pr.head.sha,
                });
                for (const s of combined.statuses) {
                  if (['failure', 'error'].includes(s.state)) {
                    failing.push({ name: s.context, url: s.target_url });
                  }
                }
              } catch (error) {
                if (error.status !== 404) {
                  console.log(`PR #${number}: unable to list commit statuses: ${error.message}`);
                }
              }

              const uniqueFailing = [...new Map(failing.map((f) => [f.name, f])).values()];

              if (uniqueFailing.length > 0) {
                const rows = uniqueFailing
                  .map((f) => `- \`${f.name}\`${f.url ? ` — [details](${f.url})` : ''}`)
                  .join('\n');
                issues.push({
                  title: 'Failing checks',
                  detail: `The following checks are failing:${rows}`,
                  fix: [
                    'Fix the failing checks locally',
                    'Commit your fix',
                    'git push',
                    'CI re-runs automatically once you push',
                  ],
                });
              }

              const body = buildBody(issues, branch, base);

              const { data: comments } = await github.rest.issues.listComments({
                owner,
                repo,
                issue_number: number,
              });
              const existing = comments.find((c) => c.body && c.body.includes(marker));

              if (issues.length === 0) {
                if (existing) {
                  await github.rest.issues.deleteComment({
                    owner,
                    repo,
                    comment_id: existing.id,
                  });
                  console.log(`PR #${number}: mergeable now, removed blocking comment`);
                } else {
                  console.log(`PR #${number}: mergeable, no comment needed`);
                }
                return;
              }

              if (existing && existing.body === body) {
                console.log(`PR #${number}: comment already up to date, skipping`);
                return;
              }

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body,
                });
                console.log(`PR #${number}: updated mergeability comment`);
              } else {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: number,
                  body,
                });
                console.log(`PR #${number}: added mergeability comment`);
              }
            }

            function buildBody(issues, branch, base) {
              const sections = issues
                .map((issue) => {
                  return `### ${issue.title}\n\n${issue.detail}\n\n**What to do:**\n\n\`\`\`sh\n${issue.fix.join('\n')}\n\`\`\``;
                })
                .join('\n\n');
              return (
                `${marker}\n\n## This pull request is not mergeable yet\n\n` +
                `Maintainer check on behalf of \`trinnode\`:\n\n` +
                `${sections}\n\n` +
                `Once you resolve these issues and push to \`${branch}\`, ` +
                `CI re-runs automatically and this ` +
                `comment updates when everything is ready to merge.`
              );
            }